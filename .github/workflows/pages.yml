name: Build and deploy

# Runs on every push, including photos added through github.com in the browser.
# Shrinks the photos, regenerates index.html from reasons.md, deploys to Pages.
# Nothing to run locally, ever.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Originals stay untouched in the repo; only the deployed copies shrink.
      - name: Shrink photos
        run: |
          shopt -s nullglob nocaseglob
          files=(site/photos/*.jpg site/photos/*.jpeg site/photos/*.png site/photos/*.webp)
          echo "found ${#files[@]} photo(s)"
          if [ ${#files[@]} -gt 0 ]; then
            magick mogrify -auto-orient -strip -resize '2000x2000>' -quality 82 "${files[@]}"
          fi

      - name: Build page
        run: python3 build.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
